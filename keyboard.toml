# Documentation: https://haobogu.github.io/rmk/keyboard_configuration.html
[keyboard]
name = "SB-486"
product_name = "SB-486"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "Subor"
chip = "rp2040"

[matrix]
# RP2040 SuperMini
row_pins = ["PIN_0", "PIN_1", "PIN_2", "PIN_3", "PIN_4", "PIN_5", "PIN_6", "PIN_7"]
col_pins = ["PIN_8", "PIN_9", "PIN_10", "PIN_11", "PIN_12", "PIN_13", "PIN_14", "PIN_15", "PIN_26", "PIN_27"]

[layout]
rows = 8
cols = 10
layers = 4
matrix_map = """
      (1,1) (1,0) (1,8) (1,6)       (1,3) (1,7) (1,5) (1,2)                               (7,4) (2,9)
(1,4) (4,4) (0,1) (4,1) (0,0) (4,0) (4,8) (0,6) (4,6) (0,3) (4,3) (0,7) (4,7) (4,5) (2,2) (0,2) (6,2) (3,2)
(7,9) (0,4) (3,1) (3,0) (3,8) (0,8) (2,6) (3,6) (2,3) (3,3) (3,7) (3,5) (0,5) (2,5)       (4,2) (3,9) (5,2)
(2,4) (3,4) (5,1) (2,1) (5,0) (2,0) (2,8) (6,6) (5,6) (5,3) (2,7) (5,7)
(6,7) (5,4) (6,1) (7,0) (6,0) (6,8) (5,8) (7,6) (7,3) (6,3) (7,7) (6,9)                         (5,5)
(6,4)       (7,1)             (7,8)                   (5,9)       (4,9)                   (7,5) (6,5) (7,2)
"""

[aliases]
num_esc = "LT(1, esc)"
num_tog = "TG(1)"

[[layer]]
name = "base"
keys = """
         f1 f2 f3 f4 f5 f6 f7 f8                @num_tog @num_tog
@num_esc 1 2 3 4 5 6 7 8 9 0 mins eql slsh bspc ins  home pgup
tab      q w e r t y u i o p lbrc rbrc ent      del  end  pgdn
caps     a s d f g h j k l scln quot
lsft     z x c v b n m comm dot slsh rsft            up
lctl lalt          spc          ralt rctl       left down rght
"""

[[layer]]
name = "num"
keys = """
_ _ _ _ f9 f10 f11 f12                       _ _
_ _ _ _ _ _ _ kp7 kp8 kp9 past _ _ grv _ num _ _
_ _ _ _ _ _ _ kp4 kp5 kp6 pmns _ _ pent  _   _ _
_ _ _ _ _ _ _ kp1 kp2 kp3 ppls _
_ _ _ _ _ _ _ kp0 no pdot psls _             volu
_ _ _ _ _                               mute vold mply

"""
